name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The browser suite starts both dev servers itself. It runs once there are
    # specs to run, so the job is skipped rather than red on an empty suite.
    if: ${{ hashFiles('apps/web/e2e/**/*.spec.ts') != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec playwright install --with-deps chromium
      - run: npm run test:e2e
