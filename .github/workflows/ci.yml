name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run analyze
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The browser suite starts both dev servers itself, through the webServer
    # entries in apps/web/playwright.config.ts.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec playwright install --with-deps chromium
      - run: npm run test:e2e
